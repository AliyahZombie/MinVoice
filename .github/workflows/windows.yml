# Windows 构建：windows-latest 上打包 NSIS/MSI 安装器 + 便携版 exe
#
# 触发方式：
#   * 手动：仓库 Actions 页面 → windows-build → Run workflow
#     （可选 debug=true：只编译调试版、不打包安装器，用于快速验证链路）
#   * 推送 v* tag：自动构建并创建 GitHub Release、附上安装包与校验和
#   * 推送到 main 且改动构建相关路径：构建并上传产物（不创建 Release）
#
# 说明：
#   * libwebrtc 不需要从源码编译 —— livekit 官方为 win-x64 提供预编译静态库
#     （webrtc-89d790b 的 webrtc-win-x64-release.zip），由 webrtc-sys 自动下载；
#     C++ 胶水层用 MSVC 编译，Windows 上无需 clang/cmake。
#   * 首次构建约 30~60 分钟（编译依赖 + 下载 libwebrtc + LTO 链接），
#     之后命中 Rust 缓存会快很多。

name: windows-build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/windows.yml"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      debug:
        description: "快速调试构建（debug 版、不打包安装器）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 构建
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 开启长路径支持（libwebrtc 解压路径较深，保险起见）
        continue-on-error: true
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null
          git config --global core.longpaths true

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust（stable，MSVC 工具链）
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建（含已下载的 libwebrtc）
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 前端构建（tsc + vite）
        run: pnpm build

      - name: Rust 单元测试（token / 配置持久化）
        working-directory: src-tauri
        run: cargo test

      - name: 构建 Windows 安装器（NSIS + MSI）
        if: ${{ !inputs.debug }}
        run: pnpm tauri build

      - name: 构建调试版（仅 exe，不打包安装器）
        if: ${{ inputs.debug }}
        run: pnpm tauri build --debug --no-bundle

      - name: 整理产物（release）
        if: ${{ !inputs.debug }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/nsis/*.exe release-assets/
          cp src-tauri/target/release/bundle/msi/*.msi release-assets/
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp src-tauri/target/release/minvoice.exe "release-assets/MinVoice_${VERSION}_x64_portable.exe"
          (cd release-assets && sha256sum *.exe *.msi > SHA256SUMS.txt)
          ls -lh release-assets/

      - name: 整理产物（debug）
        if: ${{ inputs.debug }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp src-tauri/target/debug/minvoice.exe release-assets/MinVoice_debug_x64.exe
          (cd release-assets && sha256sum *.exe > SHA256SUMS.txt)
          ls -lh release-assets/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: minvoice-windows-x64-${{ inputs.debug && 'debug' || 'release' }}
          path: release-assets/*
          if-no-files-found: error

      - name: 发布 Release（推送 v* tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
