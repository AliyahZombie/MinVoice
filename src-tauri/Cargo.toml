[package]
name = "minvoice"
version = "0.1.0"
description = "MinVoice —— 极简多人语音聊天客户端(LiveKit + Tauri)"
authors = ["aliyah"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "minvoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地签发 LiveKit token 用,三件套就够了,不引入 livekit-server-sdk
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# 语音链路的 Rust 原生实现。WebKitGTK 没有 RTCPeerConnection(见 docs/DECISIONS.md),
# 所以音频不能放 WebView 里,只能用 SDK + libwebrtc 的 ADM。
#
# 版本必须锁死:
#   livekit 0.9.2 → livekit-signaling 0.1.3 要求 prost 0.14,
#   而 livekit-protocol(至今最高 0.7.13)只用 prost 0.12,
#   于是 protobuf 生成类型不实现 prost 0.14 的 Message trait,直接编译失败。
#   signaling 0.1.2 / data-stream 0.1.5 是最后一批基于 prost 0.12 的版本。
#
# rustls-tls-native-roots:默认 `native` 特性只带 transport 不带 TLS,
# 不显式打开就连不上 wss://。用 rustls + 系统根证书,省掉 OpenSSL 链接。
livekit = { version = "=0.9.1", features = ["rustls-tls-native-roots"] }
livekit-signaling = "=0.1.2"
livekit-data-stream = "=0.1.5"

# Minimal native per-track playout-volume binding; see vendor/README.md.
[patch.crates-io]
libwebrtc = { path = "vendor/libwebrtc-0.3.49" }
webrtc-sys = { path = "vendor/webrtc-sys-0.3.46" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
