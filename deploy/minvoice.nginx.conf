# Cloudflare terminates public HTTPS. Existing NPM serves origin HTTP.
# This host is scoped to voice; us2 DNS and its services are untouched.
server {
    listen 80;
    listen [::]:80;
    server_name voice.aliyahzombie.top;
    root /data/minvoice/current;
    index index.html;

    if ($http_x_forwarded_proto != "https") {
        return 301 https://voice.aliyahzombie.top$request_uri;
    }

    access_log /data/logs/minvoice_access.log standard;
    error_log /data/logs/minvoice_error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "microphone=(self), camera=()" always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-cache" always;

    location ~ /\. { deny all; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }
    location = /sw.js { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location /icons/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
